<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Clean & Modern Todo List</title>
  <meta name="description" content="A simple, fast, and gorgeous Python-powered web Todo application.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="logo-container">
        <h1>TaskFlow</h1>
      </div>
      <div id="remaining-badge" class="task-badge">0 tasks left</div>
    </header>

    <!-- Progress bar -->
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- Add task form -->
    <form id="todo-form" class="input-form">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="todo-input" 
          class="todo-input" 
          placeholder="Add a new task..." 
          autocomplete="off"
          required
        >
      </div>
      <button type="submit" id="add-submit-btn" class="add-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add
      </button>
    </form>

    <!-- Filter Tabs -->
    <div class="filter-bar">
      <button type="button" id="tab-all" class="filter-tab active" onclick="setFilter('All')">All</button>
      <button type="button" id="tab-active" class="filter-tab" onclick="setFilter('Active')">Active</button>
      <button type="button" id="tab-completed" class="filter-tab" onclick="setFilter('Completed')">Completed</button>
    </div>

    <!-- Task List -->
    <div id="task-list" class="task-list-wrapper">
      <!-- Dynamic task items injected here -->
    </div>

    <!-- Footer Stats & Actions -->
    <div class="footer-bar">
      <span id="stats-summary">0 tasks total</span>
      <button type="button" id="clear-completed-btn" class="clear-completed-btn" onclick="clearCompleted()" style="display: none;">
        Clear Completed
      </button>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
