<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow - A modern, simple, and clean local Python Todo application to manage your tasks with rich design.">
    <title>TaskFlow — Modern Todo App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="background-decorations">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <h1 class="logo-text">TaskFlow</h1>
            <p class="tagline">Streamline your daily workflow, one task at a time.</p>
        </header>

        <section class="todo-card">
            <!-- Offline Mode Warning Banner -->
            <div id="offline-banner" class="offline-banner" style="display: none;">
                <svg class="icon-info" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span><strong>Offline Mode</strong>: Tasks saved to browser. Start server (<code>python3 todo.py</code>) and go to <a href="http://127.0.0.1:5001" target="_blank">http://127.0.0.1:5001</a> to sync with local JSON.</span>
            </div>

            <!-- Add Task Form -->
            <form id="todo-form" class="task-form" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="What needs to be done?" 
                        maxlength="150"
                        required
                        autocomplete="off"
                    >
                    <select id="task-category" aria-label="Select Category">
                        <option value="">No Category</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                    <button type="submit" id="add-task-btn" aria-label="Add Task">
                        <svg class="icon-plus" viewBox="0 0 24 24" width="20" height="20">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Task</span>
                    </button>
                </div>
                <div class="error-msg" id="form-error"></div>
            </form>

            <!-- Category Filters -->
            <div class="filter-bar" id="filter-bar">
                <button class="filter-pill active" data-category="all">All</button>
                <button class="filter-pill" data-category="Work">Work</button>
                <button class="filter-pill" data-category="Personal">Personal</button>
                <button class="filter-pill" data-category="Shopping">Shopping</button>
                <button class="filter-pill" data-category="Urgent">Urgent</button>
            </div>

            <!-- Tasks List Container -->
            <div class="tasks-container">
                <ul id="tasks-list" class="tasks-list">
                    <!-- Tasks will be dynamically injected here by JS -->
                </ul>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state">
                    <svg class="icon-empty" viewBox="0 0 24 24" width="48" height="48" fill="none">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p class="empty-text">Your sphere is clear. Enjoy your day!</p>
                </div>
            </div>

            <!-- Stats & Progress Bar -->
            <footer class="app-footer">
                <div class="stats-text">
                    <span id="completed-count">0</span> of <span id="total-count">0</span> tasks completed
                </div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </footer>
        </section>
    </main>

    <!-- Custom Script -->
    <script src="../static/app.js"></script>
</body>
</html>
